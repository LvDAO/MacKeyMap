name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-core/Cargo.toml', 'rust-core/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.value }}"

      - name: Require codesigning credentials
        env:
          MACKEYMAP_SIGNING_CERT_BASE64: ${{ secrets.MACKEYMAP_SIGNING_CERT_BASE64 }}
          MACKEYMAP_SIGNING_CERT_PASSWORD: ${{ secrets.MACKEYMAP_SIGNING_CERT_PASSWORD }}
          MACKEYMAP_KEYCHAIN_PASSWORD: ${{ secrets.MACKEYMAP_KEYCHAIN_PASSWORD }}
          MACKEYMAP_SIGN_IDENTITY: ${{ secrets.MACKEYMAP_SIGN_IDENTITY }}
        run: |
          test -n "$MACKEYMAP_SIGNING_CERT_BASE64"
          test -n "$MACKEYMAP_SIGNING_CERT_PASSWORD"
          test -n "$MACKEYMAP_KEYCHAIN_PASSWORD"
          test -n "$MACKEYMAP_SIGN_IDENTITY"

      - name: Import codesigning identity
        env:
          MACKEYMAP_SIGNING_CERT_BASE64: ${{ secrets.MACKEYMAP_SIGNING_CERT_BASE64 }}
          MACKEYMAP_SIGNING_CERT_PASSWORD: ${{ secrets.MACKEYMAP_SIGNING_CERT_PASSWORD }}
          MACKEYMAP_KEYCHAIN_PASSWORD: ${{ secrets.MACKEYMAP_KEYCHAIN_PASSWORD }}
          MACKEYMAP_SIGN_IDENTITY: ${{ secrets.MACKEYMAP_SIGN_IDENTITY }}
        run: ./scripts/import_codesign_identity.sh

      - name: Package release artifact
        env:
          MACKEYMAP_SIGN_IDENTITY: ${{ secrets.MACKEYMAP_SIGN_IDENTITY }}
          MACKEYMAP_REQUIRE_SIGNING: "1"
        run: |
          ./scripts/package_release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacKeyMap-${{ steps.version.outputs.value }}-macos.zip
          generate_release_notes: true
          name: MacKeyMap ${{ steps.version.outputs.value }}
