name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-core/Cargo.toml', 'rust-core/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run mapping benchmark
        run: cargo run --manifest-path rust-core/Cargo.toml --release --bin bench_mapping

      - name: Read app version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Package release artifact
        run: ./scripts/package_release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacKeyMap-${{ steps.version.outputs.value }}-macos
          path: dist/MacKeyMap-${{ steps.version.outputs.value }}-macos.zip
          if-no-files-found: error
